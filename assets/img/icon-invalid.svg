<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 220" stroke="#0ea5e9" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- roof (wider cabin) -->
  <path d="M10 52 Q85 10 160 52 L160 66 L10 66 Z"/>
  <path d="M24 58 Q85 28 146 58" stroke-width="2.5"/>
  <path d="M48 52 V38 Q48 32 54 32 Q60 32 60 38 V52"/>
  <!-- body -->
  <rect x="14" y="66" width="142" height="140" rx="10"/>
  <!-- vents -->
  <rect x="26" y="78" width="9" height="13" rx="2"/>
  <rect x="40" y="78" width="9" height="13" rx="2"/>
  <rect x="54" y="78" width="9" height="13" rx="2"/>
  <!-- wide door frame -->
  <path d="M66 206 V98 Q66 76 85 76 Q104 76 104 98 V206" stroke-width="3"/>
  <!-- hinges -->
  <rect x="66" y="108" width="7" height="14" rx="1.5"/>
  <rect x="66" y="168" width="7" height="14" rx="1.5"/>
  <!-- handle -->
  <rect x="97" y="140" width="9" height="13" rx="2"/>
  <!-- grab rail -->
  <path d="M76 120 H98" stroke-width="2.5"/>
