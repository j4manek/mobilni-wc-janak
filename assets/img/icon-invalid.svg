  <g stroke-width="2.8">
    <rect x="74" y="178" width="12" height="8" rx="2"/>
    <path d="M72 186 q-2 0 -2 4 v6 q0 4 4 4 h12 q4 0 4 -4 v-6 q0 -4 -2 -4 Z"/>
  </g>
  <!-- wheelchair symbol -->
  <g transform="translate(95,160)" stroke-width="3.2">
    <circle cx="6" cy="3" r="2.6" fill="#0ea5e9" stroke="none"/>
    <path d="M6 7v8l10 6"/>
    <path d="M6 15h8"/>
    <path d="M16 21l3.5 7"/>
    <circle cx="9" cy="29" r="10.5"/>
  </g>
  <ellipse cx="85" cy="212" rx="55" ry="5" stroke-width="2" opacity="0.4"/>
</svg>
